[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-search-agent"
version = "0.1.0"
description = "Meta-buscador para agentes: combina indexadores, fusiona rankings y cura con LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ddg = ["ddgs>=9.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
meta-search = "meta_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["meta_search"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src/meta_search", "eval", "tests"]
